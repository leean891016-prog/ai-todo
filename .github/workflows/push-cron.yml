name: Push Cron + Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      deviceId:
        required: false
      subscription:
        required: false
      reminders:
        required: false

jobs:
  push-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install web-push

      - name: Process sync (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deviceId
        run: node scripts/sync.js '${{ toJSON(github.event.inputs) }}'

      - name: Check reminders & send push
        run: node scripts/cron.js

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name 'github-actions'
            git config user.email 'github-actions@github.com'
            git add push-data.json
            git commit -m "cron: update push data"
            git push
          fi
