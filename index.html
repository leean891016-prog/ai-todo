<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- v2 2026-06-07 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Todo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafafa; --card: #ffffff; --text: #1a1a1a; --text-dim: #999;
  --border: #e5e5e5; --accent: #007aff; --danger: #ff3b30; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --card: #1c1c1e; --text: #f2f2f2;
    --text-dim: #666; --border: #2c2c2e; --accent: #0a84ff; --danger: #ff453a;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; display: flex; justify-content: center;
  -webkit-tap-highlight-color: transparent; user-select: none;
}

.app { width: 100%; max-width: 480px; padding: 20px 16px 100px; }

.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.header .date { font-size: 15px; color: var(--text-dim); }
.header .back-btn { font-size: 16px; color: var(--accent); cursor: pointer; background: none; border: none; }

.input-row { display: flex; gap: 8px; margin-bottom: 20px; }
.input-row input {
  flex: 1; height: 48px; padding: 0 14px; font-size: 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--card); color: var(--text); outline: none; transition: border-color 0.15s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row button {
  height: 48px; width: 48px; flex-shrink: 0; font-size: 22px; font-weight: 400;
  border: none; border-radius: var(--radius); background: var(--accent); color: #fff;
  cursor: pointer; transition: opacity 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.input-row button:active { opacity: 0.7; }
.mic-btn {
  background: var(--card) !important; color: var(--text-dim) !important;
  border: 1.5px solid var(--border) !important;
}
.mic-btn.recording { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; }
.mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.section-title {
  font-size: 13px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 10px;
}
.section-toggle {
  display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 8px 0;
}
.section-toggle .chevron { font-size: 14px; transition: transform 0.2s; }
.section-toggle.collapsed .chevron { transform: rotate(-90deg); }

.todo-list { list-style: none; margin-bottom: 20px; }

.todo-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; margin-bottom: 6px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); transition: border-color 0.15s; cursor: pointer;
}
.todo-item:active { background: var(--border); }

.todo-item .circle {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 2px solid var(--border); border-radius: 50%;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.todo-item.completed .circle { background: var(--accent); border-color: var(--accent); }
.todo-item.completed .circle::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }

.todo-item .text { flex: 1; font-size: 16px; line-height: 1.4; transition: color 0.2s, text-decoration 0.2s; }
.todo-item.completed .text { color: var(--text-dim); text-decoration: line-through; }

.todo-item .delete-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  border: none; background: none; color: var(--text-dim);
  font-size: 18px; cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.todo-item:hover .delete-btn, .todo-item:active .delete-btn { opacity: 1; }
.todo-item .delete-btn:active { background: rgba(255,59,48,0.15); color: var(--danger); }

.time-badge {
  flex-shrink: 0; font-size: 12px; color: var(--accent);
  background: rgba(0,122,255,0.1); padding: 2px 8px; border-radius: 6px; font-weight: 500;
}
@media (prefers-color-scheme: dark) {
  .time-badge { background: rgba(10,132,255,0.15); }
}

.todo-item.expired { border-color: var(--danger); background: rgba(255,59,48,0.04); }
.todo-item.expired .text { color: var(--danger); }

/* Banner */
.banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: var(--danger); color: #fff;
  padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
  font-size: 15px; font-weight: 600;
  transform: translateY(-100%); transition: transform 0.35s ease;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.banner.show { transform: translateY(0); }
.banner .banner-text { flex: 1; }

/* Badge */
.badge {
  position: fixed; bottom: 100px; right: 24px; z-index: 900;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--danger); color: #fff;
  font-size: 20px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(255,59,48,0.35); pointer-events: none;
}
.badge.show { display: flex; }

/* Tab Bar */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 800;
  display: flex; background: var(--card); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-bar button {
  flex: 1; height: 56px; border: none; background: none;
  font-size: 14px; font-weight: 500; color: var(--text-dim);
  cursor: pointer; transition: color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.tab-bar button.active { color: var(--accent); font-weight: 600; }

/* Review Panel */
.review-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
}
.review-overlay.show { display: flex; }
.review-panel {
  width: calc(100% - 40px); max-width: 400px; max-height: 80vh;
  background: var(--card); border-radius: 16px;
  padding: 24px 20px 20px; display: flex; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.review-panel h2 { font-size: 22px; margin-bottom: 6px; }
.review-panel .review-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
.review-list { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.review-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.review-item .item-text { font-size: 15px; font-weight: 500; }
.review-item input {
  height: 38px; padding: 0 12px; font-size: 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); outline: none;
}
.review-item input:focus { border-color: var(--accent); }
.review-item .hint { font-size: 11px; color: var(--text-dim); }
.review-confirm {
  width: 100%; height: 48px; border: none; border-radius: 12px;
  background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
}
.review-confirm:active { opacity: 0.7; }

/* Projects */
.project-item {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; margin-bottom: 8px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); cursor: pointer;
}
.project-item:active { background: var(--border); }
.project-item .proj-info { flex: 1; }
.project-item .proj-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.project-item .proj-bar {
  height: 6px; border-radius: 3px; background: var(--border); overflow: hidden;
}
.project-item .proj-bar-fill {
  height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.3s;
}
.project-item .proj-stat { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.project-item .proj-delete {
  width: 32px; height: 32px; border: none; background: none;
  color: var(--text-dim); font-size: 20px; cursor: pointer; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.project-item .proj-delete:active { background: rgba(255,59,48,0.1); color: var(--danger); }

.new-project-row { display: flex; gap: 8px; margin-bottom: 20px; }
.new-project-row input {
  flex: 1; height: 44px; padding: 0 14px; font-size: 15px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--card); color: var(--text); outline: none;
}
.new-project-row input:focus { border-color: var(--accent); }
.new-project-row button {
  height: 44px; padding: 0 18px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
}

.empty {
  text-align: center; color: var(--text-dim); font-size: 15px; padding: 32px 0;
}

.settings-bar { display: flex; justify-content: center; margin-bottom: 20px; }
.settings-btn {
  font-size: 13px; padding: 6px 16px;
  border: 1px solid var(--border); border-radius: 20px;
  background: var(--card); cursor: pointer; transition: all 0.15s; display: inline-block;
}
.settings-btn:active { background: var(--border); }

.footer { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 16px; }

/* Filter pills */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-pill {
  font-size: 12px; padding: 5px 14px; border-radius: 16px;
  border: 1px solid var(--border); background: var(--card); color: var(--text-dim);
  cursor: pointer; font-weight: 500;
}
.filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-pill.urgent.active { background: var(--danger); border-color: var(--danger); }
.filter-pill.important.active { background: #ff9500; border-color: #ff9500; }

/* Priority dot — right side, easy tap target */
.link-btn {
  flex-shrink: 0; width: 36px; height: 36px; border: none; background: none;
  color: var(--text-dim); font-size: 16px; cursor: pointer; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.link-btn:active { background: rgba(0,122,255,0.1); color: var(--accent); }
.link-btn.linked { color: var(--accent); }

.link-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
}
.link-overlay.show { display: flex; }
.link-panel {
  width: calc(100% - 40px); max-width: 360px; max-height: 60vh;
  background: var(--card); border-radius: 16px;
  padding: 20px; display: flex; flex-direction: column;
}
.link-panel h3 { font-size: 18px; margin-bottom: 4px; }
.link-panel .link-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
.link-list { flex: 1; overflow-y: auto; }
.link-item {
  padding: 14px 0; border-bottom: 1px solid var(--border);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.link-item:active { color: var(--accent); }

.priority-dot-wrap {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; margin: -12px -8px -12px 0; /* expand tap area */
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.priority-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2.5px solid var(--border); background: transparent;
  transition: all 0.15s; pointer-events: none;
}
.priority-dot.important { background: #ff9500; border-color: #ff9500; }
.priority-dot.urgent { background: var(--danger); border-color: var(--danger); }

/* Completed report */
.report-stats { margin-bottom: 20px; }
.report-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
.report-stat .val { font-weight: 700; }
.report-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.report-item .text { font-size: 15px; text-decoration: line-through; color: var(--text-dim); }
.report-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* Mini music player */
.music-player {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  z-index: 700; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px;
  display: none; align-items: center; gap: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  font-size: 14px;
}
.music-player.show { display: flex; }
.music-player .music-title { font-size: 12px; color: var(--text-dim); max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.music-player button {
  width: 32px; height: 32px; border: none; background: none;
  font-size: 16px; cursor: pointer; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.music-player button:active { background: var(--border); }
.music-toggle {
  font-size: 13px; padding: 6px 16px;
  border: 1px solid var(--border); border-radius: 20px;
  background: var(--card); cursor: pointer;
}

/* Procrastination popup */
.procrastinate-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 3000; background: var(--card); border: 2px solid var(--danger);
  border-radius: 16px; padding: 24px 28px; text-align: center;
  box-shadow: 0 8px 40px rgba(255,59,48,0.25);
  animation: popIn 0.4s ease, popOut 0.4s ease 3.1s forwards;
  max-width: 300px;
}
@keyframes popIn {
  from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes popOut {
  from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  to { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
}
.proc-emoji {
  font-size: 48px; animation: wobble 0.6s ease infinite alternate;
}
@keyframes wobble {
  from { transform: rotate(-8deg); }
  to { transform: rotate(8deg); }
}
.proc-sign { font-size: 15px; font-weight: 600; color: var(--danger); margin: 8px 0; }
.proc-text { font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="banner" id="banner"><span class="banner-text" id="bannerText"></span></div>
<div class="badge" id="badge">0</div>
<div class="music-player" id="musicPlayer">
  <span class="music-title" id="musicTitle">🎵 晨间轻音乐</span>
  <button id="musicPlayBtn">▶️</button>
  <button id="musicSkipBtn">⏭</button>
  <button id="musicCloseBtn">✕</button>
</div>

<div class="app">
  <div class="header" id="headerArea">
    <h1 id="headerTitle">日常</h1>
    <span class="date" id="dateDisplay"></span>
    <button class="back-btn" id="backBtn" style="display:none">← 返回</button>
  </div>

  <div id="viewContent"></div>

  <div class="settings-bar" style="flex-direction:column;align-items:center;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button class="settings-btn" id="notifBtn">🔔 开启提醒</button>
      <button class="settings-btn" id="updateBtn">🔄 强刷更新</button>
      <button class="settings-btn" id="aiSortBtn">🔀 AI排序</button>
      <button class="settings-btn music-toggle" id="musicToggle">🎵 早晚音乐</button>
    </div>
    <div id="debugInfo" style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:6px;"></div>
    <div id="aiSuggestion" style="display:none;font-size:13px;color:var(--accent);text-align:left;padding:8px 12px;background:rgba(0,122,255,0.06);border-radius:8px;margin-top:10px;line-height:1.5;"></div>
  </div>
  <div id="addDebug" style="font-size:12px;text-align:center;margin-bottom:12px;min-height:18px;color:var(--accent);font-weight:600;"></div>
</div>

<nav class="tab-bar">
  <button data-tab="inspiration">💡 灵感</button>
  <button data-tab="daily" class="active">📋 日常</button>
  <button data-tab="projects">📁 项目</button>
</nav>

<div class="link-overlay" id="linkOverlay">
  <div class="link-panel">
    <h3>📎 移动到项目</h3>
    <div class="link-sub">选择一个项目，待办将同步联动</div>
    <div class="link-list" id="linkList"></div>
  </div>
</div>

<div class="review-overlay" id="reviewOverlay">
  <div class="review-panel">
    <h2>🌙 今日盘点</h2>
    <div class="review-sub" id="reviewSub"></div>
    <div class="review-list" id="reviewList"></div>
    <button class="review-confirm" id="reviewConfirm">确认</button>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
