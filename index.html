<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- neo-brutalism v1 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFE66D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Todo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FFFDF5;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text-dim: #999;
  --border: #1A1A1A;
  --shadow: 4px 4px 0 #1A1A1A;
  --shadow-sm: 2px 2px 0 #1A1A1A;
  --accent: #FF5E5E;
  --accent2: #FFD166;
  --accent3: #06D6A0;
  --accent4: #6C5CE7;
  --radius: 0;
  --radius-sm: 0;
}

body {
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; display: flex; justify-content: center;
  -webkit-tap-highlight-color: transparent; user-select: none;
  background-image:
    radial-gradient(circle, #FFE66D 1px, transparent 1px),
    radial-gradient(circle, #FF5E5E 1px, transparent 1px),
    radial-gradient(circle, #06D6A0 1px, transparent 1px);
  background-size: 60px 60px, 80px 80px, 100px 100px;
  background-position: 10px 10px, 40px 30px, 0 0;
}

.app { width: 100%; max-width: 480px; padding: 20px 16px 120px; }

.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; padding: 16px; background: var(--accent2); border: 3px solid var(--border); box-shadow: var(--shadow); }
.header h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--text); }
.header .date { font-size: 14px; color: var(--text); font-weight: 700; }
.header .back-btn { font-size: 16px; color: var(--text); cursor: pointer; background: #FFF; border: 2px solid var(--border); padding: 4px 10px; font-weight: 700; box-shadow: var(--shadow-sm); }

.input-row { display: flex; gap: 8px; margin-bottom: 24px; }
.input-row input {
  flex: 1; height: 52px; padding: 0 16px; font-size: 16px; font-weight: 600;
  border: 3px solid var(--border); background: var(--card); color: var(--text);
  outline: none; transition: box-shadow 0.1s; font-family: inherit;
}
.input-row input:focus { box-shadow: var(--shadow); }
.input-row button {
  height: 52px; width: 52px; flex-shrink: 0; font-size: 24px; font-weight: 900;
  border: 3px solid var(--border); background: var(--accent); color: #fff;
  cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
}
.input-row button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--border); }

.mic-btn {
  background: var(--accent4) !important; color: #fff !important;
  border: 3px solid var(--border) !important; box-shadow: var(--shadow) !important;
}
.mic-btn.recording { background: var(--accent) !important; animation: pulse 0.6s infinite; }
.mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

.section-title { font-size: 14px; font-weight: 900; letter-spacing: 0.5px; color: var(--text); margin-bottom: 12px; text-transform: uppercase; display: inline-block; background: var(--accent2); padding: 2px 10px; border: 2px solid var(--border); }
.section-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 10px 4px; }
.section-toggle .chevron { font-size: 16px; font-weight: 900; transition: transform 0.2s; }
.section-toggle.collapsed .chevron { transform: rotate(-90deg); }

.todo-list { list-style: none; margin-bottom: 24px; }

.todo-item {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; margin-bottom: 10px;
  background: var(--card); border: 3px solid var(--border);
  box-shadow: var(--shadow); cursor: pointer;
  transition: all 0.1s;
}
.todo-item:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--border); }

.todo-item .circle {
  width: 26px; height: 26px; flex-shrink: 0;
  border: 3px solid var(--border); transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
  background: #FFF;
}
.todo-item.completed .circle { background: var(--accent3); border-color: var(--border); }
.todo-item.completed .circle::after { content: "✓"; color: #FFF; font-size: 16px; font-weight: 900; }

.todo-item .text { flex: 1; font-size: 16px; line-height: 1.4; font-weight: 600; transition: color 0.2s, text-decoration 0.2s; }
.todo-item.completed .text { color: var(--text-dim); text-decoration: line-through; text-decoration-thickness: 2px; }

.todo-item .delete-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  border: 2px solid var(--border); background: #FFF; color: var(--text);
  font-size: 16px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s; box-shadow: var(--shadow-sm);
}
.todo-item:hover .delete-btn, .todo-item:active .delete-btn { opacity: 1; }
.todo-item .delete-btn:active { background: var(--accent); color: #FFF; }

.time-badge {
  flex-shrink: 0; font-size: 12px; font-weight: 900; color: var(--text);
  background: var(--accent2); padding: 2px 10px; border: 2px solid var(--border);
}

.todo-item.expired { border-color: var(--accent); background: #FFF5F5; }
.todo-item.expired .text { color: var(--accent); }

/* Banner */
.banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: var(--accent); color: #FFF;
  padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
  font-size: 15px; font-weight: 700;
  transform: translateY(-100%); transition: transform 0.3s ease;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 3px solid var(--border);
}
.banner.show { transform: translateY(0); }
.banner .banner-text { flex: 1; }

/* Badge */
.badge {
  position: fixed; bottom: 100px; right: 24px; z-index: 900;
  width: 48px; height: 48px;
  background: var(--accent); color: #FFF;
  font-size: 22px; font-weight: 900;
  display: none; align-items: center; justify-content: center;
  border: 3px solid var(--border); box-shadow: var(--shadow);
}
.badge.show { display: flex; }

/* Tab Bar */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 800;
  display: flex; background: var(--card); border-top: 3px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-bar button {
  flex: 1; height: 56px; border: none; background: none;
  font-size: 14px; font-weight: 700; color: var(--text-dim);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-family: inherit;
}
.tab-bar button.active { color: var(--text); background: var(--accent2); }

/* Review Panel */
.review-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
}
.review-overlay.show { display: flex; }
.review-panel {
  width: calc(100% - 32px); max-width: 400px; max-height: 80vh;
  background: var(--card); border: 3px solid var(--border);
  padding: 24px 20px 20px; display: flex; flex-direction: column;
  box-shadow: 8px 8px 0 rgba(0,0,0,0.3); animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.review-panel h2 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
.review-panel .review-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; font-weight: 600; }
.review-list { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.review-item { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 2px solid var(--border); }
.review-item .item-text { font-size: 15px; font-weight: 700; }
.review-item input {
  height: 42px; padding: 0 14px; font-size: 14px; font-weight: 600;
  border: 2px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  font-family: inherit;
}
.review-item input:focus { box-shadow: var(--shadow-sm); }
.review-item .hint { font-size: 11px; color: var(--text-dim); font-weight: 600; }
.review-confirm {
  width: 100%; height: 52px; border: 3px solid var(--border);
  background: var(--accent3); color: var(--text); font-size: 17px; font-weight: 900; cursor: pointer;
  box-shadow: var(--shadow); font-family: inherit;
}
.review-confirm:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--border); }

/* Projects */
.project-item {
  display: flex; align-items: center; gap: 12px;
  padding: 18px; margin-bottom: 10px;
  background: var(--card); border: 3px solid var(--border);
  box-shadow: var(--shadow); cursor: pointer;
  transition: all 0.1s;
}
.project-item:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--border); }
.project-item .proj-info { flex: 1; }
.project-item .proj-name { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
.project-item .proj-bar { height: 8px; background: var(--bg); border: 2px solid var(--border); overflow: hidden; }
.project-item .proj-bar-fill { height: 100%; background: var(--accent3); }
.project-item .proj-stat { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-weight: 700; }
.project-item .proj-delete {
  width: 36px; height: 36px; border: 2px solid var(--border); background: #FFF;
  color: var(--text); font-size: 18px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
}
.project-item .proj-delete:active { background: var(--accent); color: #FFF; }

.new-project-row { display: flex; gap: 8px; margin-bottom: 24px; }
.new-project-row input {
  flex: 1; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 600;
  border: 3px solid var(--border); background: var(--card); color: var(--text); outline: none;
  font-family: inherit;
}
.new-project-row input:focus { box-shadow: var(--shadow); }
.new-project-row button {
  height: 48px; padding: 0 20px; border: 3px solid var(--border);
  background: var(--accent4); color: #FFF; font-size: 15px; font-weight: 900; cursor: pointer;
  box-shadow: var(--shadow); font-family: inherit;
}
.new-project-row button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--border); }

.empty { text-align: center; color: var(--text-dim); font-size: 15px; font-weight: 600; padding: 40px 0; }

.settings-bar { display: flex; justify-content: center; margin-bottom: 20px; }
.settings-btn {
  font-size: 13px; padding: 8px 18px; font-weight: 700;
  border: 2px solid var(--border); background: var(--card); cursor: pointer;
  transition: all 0.1s; display: inline-block;
  box-shadow: var(--shadow-sm); font-family: inherit;
  color: var(--text);
}
.settings-btn:active { transform: translate(1px, 1px); box-shadow: 0px 0px 0 var(--border); }

.footer { text-align: center; font-size: 12px; color: var(--text-dim); font-weight: 600; margin-top: 16px; }

/* Filter pills */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-pill {
  font-size: 12px; padding: 6px 16px; font-weight: 700;
  border: 2px solid var(--border); background: var(--card); color: var(--text-dim);
  cursor: pointer; box-shadow: var(--shadow-sm); font-family: inherit;
}
.filter-pill:active { transform: translate(1px, 1px); box-shadow: 0px 0px 0 var(--border); }
.filter-pill.active { background: var(--text); color: #FFF; border-color: var(--text); }
.filter-pill.urgent.active { background: var(--accent); border-color: var(--border); }
.filter-pill.important.active { background: #FF9500; border-color: var(--border); }

.link-btn {
  flex-shrink: 0; width: 40px; height: 40px; border: 2px solid var(--border); background: #FFF;
  color: var(--text-dim); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; box-shadow: var(--shadow-sm);
}
.link-btn:active { background: var(--accent3); color: var(--text); }
.link-btn.linked { background: var(--accent2); color: var(--text); }

.link-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
}
.link-overlay.show { display: flex; }
.link-panel {
  width: calc(100% - 32px); max-width: 360px; max-height: 60vh;
  background: var(--card); border: 3px solid var(--border);
  padding: 20px; display: flex; flex-direction: column;
  box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
}
.link-panel h3 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.link-panel .link-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; font-weight: 600; }
.link-list { flex: 1; overflow-y: auto; }
.link-item {
  padding: 16px 0; border-bottom: 2px solid var(--border);
  font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.link-item:active { color: var(--accent); }

.priority-dot-wrap {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; margin: -14px -8px -14px 0;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.priority-dot {
  width: 20px; height: 20px;
  border: 3px solid var(--border); background: #FFF;
  transition: all 0.15s; pointer-events: none;
}
.priority-dot.important { background: #FF9500; border-color: var(--border); }
.priority-dot.urgent { background: var(--accent); border-color: var(--border); }

/* Completed report */
.report-stats { margin-bottom: 20px; }
.report-stat { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 2px solid var(--border); font-size: 15px; font-weight: 700; }
.report-stat .val { font-weight: 900; }
.report-item { padding: 14px 0; border-bottom: 2px solid var(--border); }
.report-item .text { font-size: 15px; font-weight: 600; text-decoration: line-through; text-decoration-thickness: 2px; color: var(--text-dim); }
.report-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-weight: 600; }

/* Mini music player */
.music-player {
  position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
  z-index: 700; background: var(--card); border: 3px solid var(--border);
  padding: 12px 18px;
  display: none; align-items: center; gap: 10px;
  box-shadow: var(--shadow); font-size: 14px;
}
.music-player.show { display: flex; }
.music-player .music-title { font-size: 12px; color: var(--text-dim); max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; }
.music-player button {
  width: 36px; height: 36px; border: 2px solid var(--border); background: #FFF;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm); font-weight: 900;
}
.music-player button:active { transform: translate(1px, 1px); box-shadow: 0px 0px 0 var(--border); }
.music-toggle {
  font-size: 13px; padding: 8px 18px; font-weight: 700;
  border: 2px solid var(--border); background: var(--card); cursor: pointer;
  box-shadow: var(--shadow-sm); color: var(--text); font-family: inherit;
}

/* Procrastination popup */
.procrastinate-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 3000; background: var(--card); border: 3px solid var(--border);
  padding: 28px 32px; text-align: center;
  box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
  animation: popIn 0.4s ease, popOut 0.4s ease 3.1s forwards;
  max-width: 300px;
}
@keyframes popIn {
  from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes popOut {
  from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  to { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
}
.proc-emoji { font-size: 56px; animation: wobble 0.6s ease infinite alternate; }
@keyframes wobble { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
.proc-sign { font-size: 16px; font-weight: 900; color: var(--accent); margin: 8px 0; }
.proc-text { font-size: 14px; color: var(--text-dim); font-weight: 600; }
</style>
</head>
<body>
<div class="banner" id="banner"><span class="banner-text" id="bannerText"></span></div>
<div class="badge" id="badge">0</div>
<div class="music-player" id="musicPlayer">
  <span class="music-title" id="musicTitle">🎵 晨间轻音乐</span>
  <button id="musicPlayBtn">▶️</button>
  <button id="musicSkipBtn">⏭</button>
  <button id="musicCloseBtn">✕</button>
</div>

<div class="app">
  <div class="header" id="headerArea">
    <h1 id="headerTitle">日常</h1>
    <span class="date" id="dateDisplay"></span>
    <button class="back-btn" id="backBtn" style="display:none">← 返回</button>
  </div>

  <div id="viewContent"></div>

  <div class="settings-bar" style="flex-direction:column;align-items:center;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button class="settings-btn" id="notifBtn">🔔 开启提醒</button>
      <button class="settings-btn" id="updateBtn">🔄 强刷更新</button>
      <button class="settings-btn" id="aiSortBtn">🔀 AI排序</button>
      <button class="settings-btn music-toggle" id="musicToggle">🎵 早晚音乐</button>
    </div>
    <div id="debugInfo" style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:6px;"></div>
    <div id="aiSuggestion" style="display:none;font-size:13px;color:var(--accent);text-align:left;padding:8px 12px;background:rgba(0,122,255,0.06);border-radius:8px;margin-top:10px;line-height:1.5;"></div>
  </div>
  <div id="addDebug" style="font-size:12px;text-align:center;margin-bottom:12px;min-height:18px;color:var(--accent);font-weight:600;"></div>
</div>

<nav class="tab-bar">
  <button data-tab="inspiration">💡 灵感</button>
  <button data-tab="daily" class="active">📋 日常</button>
  <button data-tab="projects">📁 项目</button>
</nav>

<div class="link-overlay" id="linkOverlay">
  <div class="link-panel">
    <h3>📎 移动到项目</h3>
    <div class="link-sub">选择一个项目，待办将同步联动</div>
    <div class="link-list" id="linkList"></div>
  </div>
</div>

<div class="review-overlay" id="reviewOverlay">
  <div class="review-panel">
    <h2>🌙 今日盘点</h2>
    <div class="review-sub" id="reviewSub"></div>
    <div class="review-list" id="reviewList"></div>
    <button class="review-confirm" id="reviewConfirm">确认</button>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
